<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5">
<!-- 单文件版：CSS 与 JS 已全部内联，双击即可打开，也可以直接发给另一个人 -->
<title>我们 · 两个人的时间账本</title>
<style>
/* ============================================================
   「我们」系统 · 样式
   视觉基调（设计稿 §0.4）：奶白／米白 · 她粉他蓝贯穿全站 ·
   六域低饱和色块 · 标题轻正文轻数字等宽 · 温柔不催促
   ============================================================ */

:root{
  --bg:#FAF8F5;
  --bg-soft:#FBF9F7;
  --card:#FFFFFF;
  --ink:#332F2C;
  --ink-2:#7C7671;
  --ink-3:#AAA39C;
  --ink-4:#C6C0B9;
  --line:#F1ECE6;
  --line-2:#E9E3DC;

  --pink:#E8899C;
  --pink-deep:#D9748A;
  --pink-soft:#FDEEF0;
  --pink-soft-2:#FBDFE3;
  --pink-ink:#C4657C;

  --blue:#7FA9DB;
  --blue-deep:#5E86B8;
  --blue-soft:#EDF3FC;
  --blue-soft-2:#DCE9F8;
  --blue-ink:#5A7FAE;

  --green:#8FBF87;
  --green-soft:#EEF7EB;

  --warm:#E9C9A3;
  --gray-soft:#F4F1EE;

  --radius:22px;
  --radius-md:16px;
  --radius-sm:12px;
  --shadow:0 2px 10px rgba(184,164,152,.055);
  --shadow-lg:0 8px 28px rgba(150,130,120,.10);

  --serif:"Noto Serif SC","Songti SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
img,svg{display:block;}
.hide{display:none !important;}
.muted{color:var(--ink-3);}
.center{text-align:center;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}

/* ---------------- 骨架 ---------------- */
.app{display:flex;min-height:100vh;}

.sidebar{display:none;}

.view{
  flex:1;
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:22px 18px 104px;
}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 0;color:var(--ink-3);font-size:11px;letter-spacing:.4px;
  transition:color .18s;
}
.tab svg{width:22px;height:22px;}
.tab.on{color:var(--pink);}
.tab.on .tab-ico-wrap{background:var(--pink-soft);}
.tab-ico-wrap{
  display:flex;align-items:center;justify-content:center;
  width:40px;height:26px;border-radius:13px;transition:background .18s;
}

/* ---------------- 页头 ---------------- */
.page-head{padding:6px 2px 18px;}
.page-title{
  font-family:var(--serif);
  font-size:30px;
  font-weight:600;
  letter-spacing:1px;
  line-height:1.3;
  margin:0;
}
.page-sub{margin:6px 0 0;color:var(--ink-3);font-size:13.5px;letter-spacing:.2px;}

.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 16px;}
.brand{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.5px;}
.brand small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-3);letter-spacing:1.4px;font-weight:400;margin-top:2px;}
.topline-date{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13.5px;}
.topline-date svg{width:17px;height:17px;color:var(--ink-3);}

/* ---------------- 卡片 ---------------- */
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}
.card.tight{padding:14px 16px;}
.card-title{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:16px;font-weight:600;letter-spacing:.3px;
  margin:0 0 14px;
}
.card-title .sub{font-size:12px;color:var(--ink-3);font-weight:400;letter-spacing:.2px;}
.card-link{font-size:12.5px;color:var(--blue-ink);font-weight:400;display:inline-flex;align-items:center;gap:3px;}

/* ---------------- 状态卡 ---------------- */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.stat-card{
  border-radius:20px;padding:16px 16px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:88px;
}
.stat-card.me{background:var(--pink-soft);}
.stat-card.him{background:var(--blue-soft);}
.stat-k{font-size:12.5px;color:var(--ink-2);letter-spacing:.6px;}
.stat-v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.2;margin-top:2px;}
.stat-v em{font-style:normal;font-size:14px;font-family:var(--sans);color:var(--ink-2);margin-left:2px;}
.stat-ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.stat-card.me .stat-ico{background:rgba(232,137,156,.16);color:var(--pink-deep);}
.stat-card.him .stat-ico{background:rgba(127,169,219,.16);color:var(--blue-deep);}
.stat-ico svg{width:18px;height:18px;}

/* ---------------- 平行空间按钮（不可拨） ---------------- */
.parallel{
  width:100%;display:flex;align-items:center;gap:10px;
  background:var(--pink-soft);
  border-radius:16px;padding:12px 15px;
  color:var(--pink-ink);font-size:13.5px;letter-spacing:.2px;
  margin-bottom:16px;
}
.parallel .p-ico{width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--pink);flex:0 0 auto;}
.parallel .p-ico svg{width:15px;height:15px;}
.parallel .p-txt{flex:1;text-align:left;}
.parallel .p-arrow{color:var(--pink);display:flex;}
.parallel .p-arrow svg{width:15px;height:15px;}
.parallel.closed{background:var(--gray-soft);color:var(--ink-2);}
.parallel.closed .p-ico{color:var(--ink-3);}
.parallel.closed .p-arrow{color:var(--ink-3);}

/* ---------------- 双人 tab（手机） ---------------- */
.pair-tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  background:#F5F1ED;border-radius:16px;padding:4px;margin-bottom:14px;
}
.pair-tab{
  padding:9px 0;border-radius:13px;font-size:14px;color:var(--ink-2);
  letter-spacing:.5px;transition:all .2s;
}
.pair-tab.on{background:#fff;color:var(--pink-ink);font-weight:600;box-shadow:0 1px 4px rgba(180,160,150,.10);}
.pair-tab.on.him{color:var(--blue-ink);}

/* ---------------- 记录条目 ---------------- */
.entries{display:flex;flex-direction:column;}
.entry{
  display:flex;gap:11px;padding:11px 0;
  position:relative;
}
.entry + .entry{border-top:1px solid var(--line);}
.entry-ico{
  width:42px;height:42px;border-radius:14px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
}
.entry-ico svg{width:20px;height:20px;}
.entry-main{flex:1;min-width:0;}
.entry-line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.entry-time{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);letter-spacing:.2px;}
.entry-dur{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-left:auto;}
.entry-chip{
  font-size:11px;padding:1.5px 8px;border-radius:9px;letter-spacing:.3px;
  background:var(--gray-soft);color:var(--ink-2);
}
.entry-text{margin-top:3px;font-size:14.5px;color:var(--ink);letter-spacing:.2px;}
.entry-bar{margin-top:8px;height:5px;border-radius:3px;background:#F3EFEA;overflow:hidden;}
.entry-bar i{display:block;height:100%;border-radius:3px;}
.entry-arrow{display:flex;align-items:center;color:var(--ink-4);}
.entry-arrow svg{width:15px;height:15px;}

.entry-name-row{
  display:flex;align-items:center;gap:8px;margin-bottom:4px;
}
.who-ava{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;}
.who-ava.me{background:linear-gradient(135deg,#F3A7B6,#E8899C);}
.who-ava.him{background:linear-gradient(135deg,#A6C6E8,#7FA9DB);}
.who-name{font-size:15px;font-weight:600;letter-spacing:.4px;}

/* ---------------- 堆叠条 ---------------- */
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#F3EFEA;margin:2px 0 12px;}
.stack i{display:block;height:100%;}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);}
.legend-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.legend-item b{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:11.5px;margin-left:auto;}
.legend-item .pct{color:var(--ink-3);font-size:11px;width:32px;text-align:right;font-family:var(--mono);}

.total-line{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-bottom:10px;}
.total-line b{font-family:var(--mono);color:var(--ink-2);font-weight:500;}

/* ---------------- 未分类提示 ---------------- */
.tip-row{
  display:flex;align-items:center;gap:8px;
  background:var(--gray-soft);border-radius:13px;
  padding:9px 13px;margin-top:12px;
  font-size:12.5px;color:var(--ink-2);
}
.tip-row svg{width:14px;height:14px;color:var(--ink-3);flex:0 0 auto;}
.tip-row .go{margin-left:auto;color:var(--blue-ink);display:inline-flex;align-items:center;gap:2px;}
.tip-row .go svg{width:13px;height:13px;color:var(--blue-ink);}

/* ---------------- 记一笔（悬浮/顶栏） ---------------- */
.fab{
  position:fixed;right:22px;bottom:86px;z-index:50;
  display:inline-flex;align-items:center;gap:6px;
  background:var(--pink);color:#fff;
  padding:12px 18px;border-radius:26px;
  font-size:14px;letter-spacing:.6px;
  box-shadow:0 6px 20px rgba(232,137,156,.36);
}
.fab svg{width:15px;height:15px;}
.top-add{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--pink);color:#fff;
  padding:8px 15px;border-radius:20px;font-size:13px;letter-spacing:.4px;
  box-shadow:0 4px 14px rgba(232,137,156,.30);
}
.top-add svg{width:14px;height:14px;}

/* ---------------- 积分池 ---------------- */
.pool{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
.pool-cell{
  border-radius:16px;padding:12px 10px;text-align:center;
  background:var(--gray-soft);
}
.pool-cell.me{background:var(--pink-soft);}
.pool-cell.him{background:var(--blue-soft);}
.pool-k{font-size:11.5px;color:var(--ink-2);letter-spacing:.3px;}
.pool-v{font-family:var(--serif);font-size:23px;font-weight:600;margin-top:3px;line-height:1.2;}
.pool-ico{width:18px;height:18px;margin:0 auto 3px;opacity:.75;}
.pool-cell.me .pool-ico{color:var(--pink-deep);}
.pool-cell.him .pool-ico{color:var(--blue-deep);}
.pool-cell.sum .pool-ico{color:var(--ink-3);}
.pool-src{
  display:flex;align-items:center;gap:8px;
  border-top:1px solid var(--line);margin-top:13px;padding-top:12px;
  font-size:12.5px;color:var(--ink-2);
}
.pool-src b{color:var(--ink);font-weight:600;}
.pool-src .go{margin-left:auto;color:var(--ink-3);display:inline-flex;}
.pool-src .go svg{width:14px;height:14px;}

.ledger-row{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:13px;border-top:1px dashed var(--line-2);}
.ledger-row:first-child{border-top:0;}
.ledger-row .src{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--gray-soft);color:var(--ink-2);}
.ledger-row .src.joint{background:var(--pink-soft);color:var(--pink-ink);}
.ledger-row .d{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-2);}

/* ---------------- 本周进度 ---------------- */
.prog-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 0;border-top:1px solid var(--line);
}
.prog-row:first-of-type{border-top:0;}
.prog-ico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.prog-ico svg{width:18px;height:18px;}
.prog-main{flex:1;min-width:0;}
.prog-name{font-size:14.5px;font-weight:500;letter-spacing:.3px;}
.prog-dots{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:12px;color:var(--ink-3);}
.dot-s{width:8px;height:8px;border-radius:50%;background:#EAE4DE;}
.dot-s.on{background:currentColor;}
.prog-dots .txt{font-family:var(--mono);font-size:11.5px;margin-left:3px;}
.settle-row{
  display:flex;align-items:center;gap:8px;
  background:var(--pink-soft);border-radius:13px;
  padding:9px 13px;margin-top:12px;
  font-size:12.5px;color:var(--pink-ink);
}
.settle-row svg{width:14px;height:14px;}
.settle-row b{color:var(--pink-deep);}

/* ---------------- 愿望 tab ---------------- */
.mini-tabs{display:flex;gap:7px;margin-bottom:13px;}
.mini-tab{
  padding:5px 13px;border-radius:14px;font-size:12.5px;
  background:var(--gray-soft);color:var(--ink-2);letter-spacing:.3px;
}
.mini-tab.on{background:var(--pink-soft);color:var(--pink-ink);font-weight:600;}

.wish-item{
  display:flex;align-items:center;gap:11px;
  padding:12px 0;border-top:1px solid var(--line);
}
.wish-item:first-of-type{border-top:0;}
.wish-ico{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.wish-ico svg{width:19px;height:19px;}
.wish-main{flex:1;min-width:0;}
.wish-name{font-size:14.5px;font-weight:500;}
.wish-meta{font-size:12px;color:var(--ink-3);margin-top:2px;}
.wish-btn{
  padding:6px 14px;border-radius:15px;font-size:12.5px;white-space:nowrap;
  background:var(--pink-soft);color:var(--pink-ink);letter-spacing:.2px;
}
.wish-btn.saving{background:var(--gray-soft);color:var(--ink-2);}
.wish-btn.done{background:var(--green-soft);color:#5F8F58;}

/* ---------------- 故事接龙卡 ---------------- */
.story-card{background:var(--pink-soft);border-radius:18px;padding:14px;}
.story-head{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--pink-ink);}
.story-head .ico{width:24px;height:24px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;}
.story-head .ico svg{width:13px;height:13px;}
.story-body{margin-top:8px;font-size:14px;color:var(--ink);line-height:1.75;}
.story-foot{display:flex;align-items:center;justify-content:flex-end;margin-top:10px;}
.story-foot button{font-size:12.5px;color:var(--pink-ink);display:inline-flex;align-items:center;gap:3px;}

/* ---------------- 日历 ---------------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:1px;}
.cal-nav{display:flex;gap:4px;}
.cal-nav button{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);}
.cal-nav button svg{width:16px;height:16px;}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-week{margin-bottom:6px;}
.cal-week span{text-align:center;font-size:11.5px;color:var(--ink-3);letter-spacing:.5px;}
.cal-grid{gap:2px 0;}
.cal-cell{
  aspect-ratio:1/1.06;
  display:flex;flex-direction:column;align-items:center;
  padding-top:7px;position:relative;
}
.cal-cell .d{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);}
.cal-cell.out .d{color:var(--ink-4);}
.cal-cell.today .d{
  color:#fff;background:var(--pink);border-radius:50%;
  width:23px;height:23px;display:flex;align-items:center;justify-content:center;
  margin-top:-2px;
}
.cal-marks{display:flex;gap:2px;margin-top:4px;height:6px;align-items:center;}
.cal-marks i{width:4px;height:4px;border-radius:50%;display:block;}
.cal-legend{display:flex;justify-content:flex-end;gap:14px;margin-top:12px;font-size:11.5px;color:var(--ink-3);}
.cal-legend span{display:inline-flex;align-items:center;gap:5px;}
.cal-legend i{width:5px;height:5px;border-radius:50%;display:block;}

/* ---------------- 时间分布横条（回看） ---------------- */
.bars{display:flex;flex-direction:column;gap:11px;margin-top:4px;}
.bar-row{display:flex;align-items:center;gap:9px;}
.bar-ico{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.bar-ico svg{width:14px;height:14px;}
.bar-name{width:40px;font-size:12.5px;color:var(--ink-2);flex:0 0 auto;}
.bar-track{flex:1;height:9px;border-radius:5px;background:#F5F1ED;overflow:hidden;}
.bar-track i{display:block;height:100%;border-radius:5px;}
.bar-val{width:56px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-2);flex:0 0 auto;}

.self-line{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 0 0;margin-top:4px;border-top:1px solid var(--line);
  font-size:13px;color:var(--ink-2);
}
.self-line b{font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600;}

/* ---------------- 快乐值折线 ---------------- */
.chart-wrap{position:relative;margin:2px 0 4px;}
.chart-wrap svg{width:100%;height:auto;display:block;}
.chart-tip{font-size:12px;color:var(--ink-3);margin-top:6px;}

.low-list{margin-top:10px;border-top:1px dashed var(--line-2);padding-top:10px;}
.low-item{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px;}
.low-item .t{font-family:var(--mono);font-size:12px;color:var(--ink-3);}
.low-item .c{font-size:11px;padding:1px 7px;border-radius:8px;}
.low-item .s{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--pink-deep);}
.filter-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:14px;
  background:var(--gray-soft);color:var(--ink-2);font-size:12px;
}
.filter-btn.on{background:var(--pink-soft);color:var(--pink-ink);}

/* ---------------- 时间线 ---------------- */
.tline{position:relative;padding-left:18px;}
.tline::before{
  content:"";position:absolute;left:4px;top:8px;bottom:8px;
  width:1px;background:var(--line-2);
}
.tline-item{position:relative;padding:9px 0;}
.tline-item::before{
  content:"";position:absolute;left:-18px;top:15px;
  width:7px;height:7px;border-radius:50%;background:var(--pink);
  box-shadow:0 0 0 3px #fff;
}
.tline-item.him::before{background:var(--blue);}
.tline-item.gray::before{background:var(--ink-4);}
.tline-date{font-family:var(--mono);font-size:12px;color:var(--ink-3);}
.tline-date .wd{font-family:var(--sans);margin-left:5px;}
.tline-text{font-size:13.5px;margin-top:2px;}

/* ---------------- 统计小结（成篇入口） ---------------- */
.sum-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);}
.sum-row:first-of-type{border-top:0;}
.sum-ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.sum-ico svg{width:17px;height:17px;}
.sum-main{flex:1;}
.sum-k{font-size:14px;font-weight:500;}
.sum-d{font-size:11.5px;color:var(--ink-3);margin-top:1px;}

/* ---------------- 设置页 ---------------- */
.member-card{display:flex;align-items:center;gap:14px;}
.member{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;}
.member-ava{
  width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:22px;font-weight:600;color:#fff;
}
.member-ava.me{background:linear-gradient(135deg,#F6BCC7,#E8899C);}
.member-ava.him{background:linear-gradient(135deg,#B4D1EC,#7FA9DB);}
.member-nm{font-size:13.5px;color:var(--ink);letter-spacing:.3px;}
.member-nm i{font-style:normal;color:var(--ink-3);margin-left:3px;}
.member-mid{flex:1.1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 6px;}
.member-mid .h{color:var(--pink);}
.member-mid .h svg{width:18px;height:18px;}
.member-mid .conn{font-size:11.5px;color:var(--ink-3);letter-spacing:.2px;}
.code-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);}
.code-row b{font-family:var(--mono);font-size:12.5px;letter-spacing:.8px;color:var(--ink);font-weight:600;}
.copy-btn{background:var(--gray-soft);border-radius:10px;padding:2px 8px;font-size:11px;color:var(--ink-2);}

.switch-card{background:var(--pink-soft);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:13px;margin-bottom:16px;}
.switch-ico{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--pink-deep);flex:0 0 auto;}
.switch-ico svg{width:20px;height:20px;}
.switch-main{flex:1;min-width:0;}
.switch-k{font-size:15px;font-weight:600;letter-spacing:.3px;}
.switch-d{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.5;}
.switch-h{font-size:11.5px;color:var(--ink-3);margin-top:3px;}

.switch{width:48px;height:28px;border-radius:14px;background:#E4DED8;position:relative;flex:0 0 auto;transition:background .2s;}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:transform .2s;
}
.switch.on{background:var(--pink);}
.switch.on::after{transform:translateX(20px);}

.list-group{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px;}
.list-row{
  display:flex;align-items:center;gap:13px;
  padding:15px 18px;width:100%;text-align:left;
  border-top:1px solid var(--line);
}
.list-row:first-child{border-top:0;}
.list-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.list-ico svg{width:19px;height:19px;}
.list-main{flex:1;min-width:0;}
.list-k{font-size:15px;letter-spacing:.2px;}
.list-d{font-size:11.5px;color:var(--ink-3);margin-top:1px;}
.list-arrow{color:var(--ink-4);display:flex;}
.list-arrow svg{width:16px;height:16px;}

.page-foot{
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:8px 0 4px;font-size:12px;color:var(--ink-3);letter-spacing:.3px;
}
.page-foot::before,.page-foot::after{
  content:"";height:1px;width:34px;background:var(--line-2);
}

/* ---------------- 子页 ---------------- */
.sub-head{
  display:grid;grid-template-columns:40px 1fr 40px;align-items:center;
  padding:2px 0 16px;
}
.sub-back{display:flex;align-items:center;gap:2px;color:var(--ink-2);font-size:13.5px;height:34px;}
.sub-back svg{width:17px;height:17px;}
.sub-title{text-align:center;font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.6px;}
.sub-right{text-align:right;font-size:12px;color:var(--ink-3);}
.sub-lead{text-align:center;font-size:12.5px;color:var(--ink-3);margin:-10px 0 18px;letter-spacing:.2px;}

/* 长期目标卡 */
.goal-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.goal-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.goal-ico{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--pink-soft);color:var(--pink-deep);}
.goal-ico svg{width:20px;height:20px;}
.goal-name{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.6px;flex:1;}
.goal-edit{color:var(--ink-4);display:flex;}
.goal-edit svg{width:17px;height:17px;}
.kv{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;}
.kv-k{width:64px;color:var(--ink-3);flex:0 0 auto;font-size:13px;}
.kv-v{flex:1;color:var(--ink);}
.kw-list{display:flex;flex-wrap:wrap;gap:6px;}
.kw{font-size:12px;padding:3px 10px;border-radius:11px;background:var(--gray-soft);color:var(--ink-2);}
.kw.pink{background:var(--pink-soft);color:var(--pink-ink);}
.kw.blue{background:var(--blue-soft);color:var(--blue-ink);}
.goal-foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:13px;padding-top:13px;}
.goal-stat{font-size:12.5px;color:var(--ink-2);}
.goal-stat b{font-family:var(--mono);color:var(--ink);}
.goal-btns{margin-left:auto;display:flex;gap:8px;}
.btn-mini{padding:6px 13px;border-radius:14px;font-size:12.5px;background:var(--pink-soft);color:var(--pink-ink);display:inline-flex;align-items:center;gap:4px;}
.btn-mini svg{width:13px;height:13px;}
.btn-mini.ghost{background:var(--gray-soft);color:var(--ink-2);}
.add-block{
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--pink-soft);color:var(--pink-ink);
  border-radius:18px;padding:13px;font-size:13.5px;letter-spacing:.3px;margin-bottom:16px;
}
.add-block svg{width:15px;height:15px;}

/* 兑换流程 */
.flow{display:flex;align-items:flex-start;gap:4px;}
.flow-step{flex:1;text-align:center;}
.flow-ico{width:44px;height:44px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;}
.flow-ico svg{width:21px;height:21px;}
.flow-k{font-size:12.5px;font-weight:600;letter-spacing:.2px;}
.flow-d{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.5;}
.flow-arrow{color:var(--ink-4);padding-top:13px;display:flex;}
.flow-arrow svg{width:14px;height:14px;}

.pay-row{display:flex;align-items:center;gap:10px;border-radius:15px;padding:12px 14px;margin-top:9px;font-size:13.5px;}
.pay-row.me{background:var(--pink-soft);}
.pay-row.him{background:var(--blue-soft);}
.pay-row .ava{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;}
.pay-row .ava svg{width:13px;height:13px;}
.pay-row.me .ava{background:var(--pink);}
.pay-row.him .ava{background:var(--blue);}
.pay-row .v{margin-left:auto;font-family:var(--serif);font-size:17px;font-weight:600;}

/* 奖励分组 */
.tip-band{
  display:flex;align-items:center;gap:8px;
  background:var(--pink-soft);border-radius:15px;padding:11px 15px;
  font-size:12.5px;color:var(--pink-ink);margin-bottom:16px;
}
.tip-band svg{width:14px;height:14px;flex:0 0 auto;}
.reward-group{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;}
.reward-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.reward-ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.reward-ico svg{width:17px;height:17px;}
.reward-k{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.5px;}
.reward-d{font-size:11.5px;color:var(--ink-3);margin-left:2px;}
.reward-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);}
.reward-item .ri{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.reward-item .ri svg{width:16px;height:16px;}
.reward-item .rm{flex:1;font-size:14px;min-width:0;}
.reward-item .rp{font-size:11.5px;color:var(--ink-3);white-space:nowrap;}
.reward-item .re{color:var(--ink-4);display:flex;padding-left:6px;}
.reward-item .re svg{width:15px;height:15px;}

/* 分类色板 */
.cat-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);}
.cat-item:first-child{border-top:0;}
.grip{color:var(--ink-4);display:flex;flex-direction:column;gap:3px;cursor:grab;}
.grip i{display:block;width:13px;height:1.5px;background:currentColor;border-radius:2px;}
.swatch{width:34px;height:26px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.swatch svg{width:13px;height:13px;color:rgba(255,255,255,.9);}
.cat-main{flex:1;min-width:0;}
.cat-name{font-size:14.5px;font-weight:500;}
.cat-name i{font-style:normal;color:var(--ink-3);font-weight:400;font-size:12.5px;margin-left:6px;}
.cat-edit{color:var(--ink-4);display:flex;}
.cat-edit svg{width:16px;height:16px;}

/* 见面倒计时 */
.count-card{
  background:linear-gradient(120deg,#FDEEF0 0%,#F7F1FA 52%,#EDF3FC 100%);
  border-radius:var(--radius);padding:22px;margin-bottom:16px;
  display:flex;align-items:center;gap:14px;
}
.count-main{flex:1;}
.count-k{font-size:12.5px;color:var(--ink-2);letter-spacing:.4px;}
.count-v{font-family:var(--serif);font-size:42px;font-weight:600;line-height:1.15;margin:2px 0;}
.count-v em{font-style:normal;font-family:var(--sans);font-size:15px;color:var(--ink-2);margin-left:2px;}
.count-date{font-size:12.5px;color:var(--ink-2);}
.count-note{font-size:12px;color:var(--ink-3);margin-top:7px;}
.count-ico{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;color:var(--pink);flex:0 0 auto;}
.count-ico svg{width:30px;height:30px;}

/* 故事接龙 */
.prev-card{background:var(--blue-soft);border-radius:20px;padding:16px 18px;margin-bottom:14px;}
.prev-head{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--blue-ink);margin-bottom:8px;}
.prev-head .ico{width:24px;height:24px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;}
.prev-head .ico svg{width:13px;height:13px;}
.prev-body{font-size:14.5px;line-height:1.8;color:var(--ink);}
.turn-badge{
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--pink-soft);color:var(--pink-ink);
  border-radius:14px;padding:7px;font-size:12.5px;
  margin:0 auto 14px;width:fit-content;letter-spacing:.3px;
}
.turn-badge svg{width:13px;height:13px;}
.write-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.write-area{
  width:100%;min-height:112px;border:0;outline:none;resize:none;
  font-size:16px;line-height:1.85;color:var(--ink);
  background:transparent;font-family:var(--sans);
}
.write-area::placeholder{color:var(--ink-4);}
.write-foot{display:flex;align-items:center;gap:10px;margin-top:6px;}
.write-count{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);}
.spark-btn{
  margin-left:auto;display:inline-flex;align-items:center;gap:5px;
  background:var(--blue-soft);color:var(--blue-ink);
  border-radius:13px;padding:5px 12px;font-size:12px;
}
.spark-btn svg{width:13px;height:13px;}
.point-band{
  display:flex;align-items:center;gap:11px;
  background:var(--pink-soft);border-radius:18px;padding:14px 16px;margin-bottom:16px;
}
.point-band .icon{width:30px;height:30px;border-radius:50%;background:rgba(232,137,156,.22);color:var(--pink-deep);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.point-band .icon svg{width:15px;height:15px;}
.point-band .k{font-size:13.5px;color:var(--ink);}
.point-band .d{font-size:11.5px;color:var(--ink-3);margin-top:2px;}

/* 故事成篇 */
.story-flow{position:relative;padding-left:26px;}
.story-flow::before{content:"";position:absolute;left:5px;top:10px;bottom:70px;width:1px;background:var(--line-2);}
.story-seg{position:relative;margin-bottom:13px;}
.story-seg::before{
  content:"";position:absolute;left:-26px;top:16px;width:9px;height:9px;border-radius:50%;
  background:var(--pink);box-shadow:0 0 0 3px var(--bg);
}
.story-seg.him::before{background:var(--blue);}
.story-seg .seg-card{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);}
.seg-who{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:10px;margin-bottom:8px;}
.seg-who.me{background:var(--pink-soft);color:var(--pink-ink);}
.seg-who.him{background:var(--blue-soft);color:var(--blue-ink);}
.seg-who svg{width:11px;height:11px;}
.seg-text{font-size:15px;line-height:1.9;color:var(--ink);}

/* 愿望清单管理 */
.wish-group{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;}
.wish-group-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.wg-ico{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.wg-ico svg{width:18px;height:18px;}
.wg-k{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.5px;flex:1;}
.wg-add{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:4px 10px;border-radius:12px;}
.wg-add svg{width:12px;height:12px;}
.wi-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--line);}
.wi-ico{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.wi-ico svg{width:19px;height:19px;}
.wi-main{flex:1;min-width:0;}
.wi-name{font-size:14.5px;font-weight:500;}
.wi-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
.wi-edit{color:var(--ink-4);display:flex;}
.wi-edit svg{width:15px;height:15px;}
.wi-btn{padding:6px 13px;border-radius:14px;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
.wi-btn svg{width:12px;height:12px;}
.wi-btn.ready{background:var(--pink-soft);color:var(--pink-ink);}
.wi-btn.saving{background:var(--gray-soft);color:var(--ink-2);}

/* ---------------- 底部弹层（记一笔） ---------------- */
.sheet-mask{
  position:fixed;inset:0;z-index:80;
  background:rgba(60,50,45,.34);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .2s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:520px;
  background:var(--bg);
  border-radius:26px 26px 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));
  max-height:92vh;overflow-y:auto;
  animation:up .26s cubic-bezier(.22,.8,.3,1);
}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:#E2DCD6;margin:0 auto 12px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.sheet-title{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:1px;}
.sheet-x{color:var(--ink-3);display:flex;padding:4px;}
.sheet-x svg{width:18px;height:18px;}

.field{margin-bottom:17px;}
.field-k{font-size:13.5px;color:var(--ink-2);margin-bottom:8px;letter-spacing:.3px;}
.field-k i{font-style:normal;color:var(--ink-4);font-size:11.5px;margin-left:4px;}
.time-row{display:flex;gap:10px;align-items:flex-end;}
.time-box{flex:1;}
.time-box .tk{font-size:11.5px;color:var(--ink-3);margin-bottom:4px;}
.time-input{
  width:100%;background:#fff;border:1px solid var(--line-2);border-radius:14px;
  padding:11px 13px;font-family:var(--mono);font-size:15px;letter-spacing:.5px;
  outline:none;-webkit-appearance:none;appearance:none;
}
.time-input:focus{border-color:var(--pink-soft-2);}
.time-dur{flex:1.2;}
.time-dur .dv{font-family:var(--mono);font-size:16px;color:var(--ink);padding:11px 0;letter-spacing:.3px;}

.textarea{
  width:100%;background:#fff;border:1px solid var(--line-2);border-radius:16px;
  padding:13px 14px;font-size:15px;line-height:1.7;outline:none;resize:none;
  min-height:88px;
}
.textarea:focus{border-color:var(--pink-soft-2);}
.textarea::placeholder{color:var(--ink-4);}
.textarea-foot{display:flex;justify-content:flex-end;}
.count-badge{font-family:var(--mono);font-size:11px;color:var(--ink-4);margin-top:2px;}

.chips{display:flex;flex-wrap:wrap;gap:9px;}
.chip-cat{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 15px;border-radius:15px;
  font-size:13.5px;border:1.5px solid transparent;
  background:var(--gray-soft);color:var(--ink-2);
  transition:all .16s;
}
.chip-cat .cdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.chip-cat.on{background:#fff;border-color:var(--blue);color:var(--ink);}
.chip-hint{font-size:11.5px;color:var(--ink-3);margin-top:8px;}

.happy-row{display:flex;gap:11px;}
.happy-dot{
  width:42px;height:42px;border-radius:50%;
  background:#fff;border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:15px;color:var(--ink-2);
  transition:all .16s;
}
.happy-dot.on{background:var(--pink);border-color:var(--pink);color:#fff;}

.btn-primary{
  width:100%;background:var(--pink);color:#fff;
  border-radius:22px;padding:15px;
  font-size:15.5px;letter-spacing:1.2px;
  box-shadow:0 6px 18px rgba(232,137,156,.30);
}
.btn-primary:active{transform:translateY(1px);}
.btn-ghost{
  width:100%;background:#fff;color:var(--ink-2);
  border-radius:22px;padding:14px;
  font-size:15px;letter-spacing:.8px;
  border:1px solid var(--line-2);
}
.btn-blue{
  width:100%;background:var(--blue);color:#fff;
  border-radius:22px;padding:15px;
  font-size:15.5px;letter-spacing:1.2px;
  box-shadow:0 6px 18px rgba(127,169,219,.28);
}
.btn-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-row{display:flex;flex-direction:column;gap:10px;}
.foot-line{text-align:center;font-size:12px;color:var(--ink-3);margin-top:14px;letter-spacing:.4px;}

/* 输入（子页表单） */
.form-line{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line-2);border-radius:15px;
  padding:12px 14px;font-size:14.5px;
}
.form-line svg{width:17px;height:17px;color:var(--ink-3);flex:0 0 auto;}
.form-line select,.form-line input{border:0;outline:none;background:none;flex:1;font-size:15px;-webkit-appearance:none;appearance:none;}

/* 空状态 */
.empty{
  text-align:center;color:var(--ink-3);font-size:13px;
  padding:26px 10px;letter-spacing:.3px;
}

/* ---------------- 电脑版 ---------------- */
@media (min-width:980px){
  .tabbar{display:none;}
  .fab{display:none;}

  .sidebar{
    display:flex;flex-direction:column;
    width:212px;flex:0 0 212px;
    background:var(--bg-soft);
    border-right:1px solid var(--line);
    padding:26px 16px 22px;
    position:sticky;top:0;height:100vh;
  }
  .side-brand{font-family:var(--serif);font-size:22px;font-weight:600;padding:0 8px;letter-spacing:.6px;}
  .side-brand .h{color:var(--pink);}
  .side-sub{font-size:11px;color:var(--ink-3);letter-spacing:1.2px;padding:3px 8px 26px;}
  .side-nav{display:flex;flex-direction:column;gap:4px;}
  .side-item{
    display:flex;align-items:center;gap:11px;
    padding:11px 12px;border-radius:14px;
    font-size:14.5px;color:var(--ink-2);letter-spacing:.3px;
    transition:all .16s;
  }

  .pair-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  .pair-col{border-radius:var(--radius);padding:18px;}

  .pair-col.him{background:var(--blue-soft);}

  .pair-col .col-name{font-size:14.5px;font-weight:600;letter-spacing:.3px;}
  .pair-col .col-sub{font-size:11px;color:var(--ink-3);}
  .col-card{background:#fff;border-radius:16px;padding:14px 15px;margin-top:12px;box-shadow:var(--shadow);}
  .desk-bottom{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-top:18px;}

  .desk-foot{
    display:flex;align-items:center;gap:10px;
    margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--ink-3);letter-spacing:.4px;

  .desk-foot .avas{display:flex;}
  .desk-foot .side-ava{width:24px;height:24px;font-size:10px;border:2px solid var(--bg);}

  /* 电脑版其它页放宽 */
  .wide-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .sub-wrap{max-width:560px;margin:0 auto;}
  .mobile-only{display:none !important;}
}

  .desk-only{display:none !important;}
  .desk-top{display:none !important;}

<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="sheet-root"></div>

<script>
/* ============================================================
   data.js
   ============================================================ */
/* ============================================================
   「我们」系统 · 数据层
   设计稿 v3（2026-10-29）§六 11 张表
   ------------------------------------------------------------
   ⚠️ 2026-10-30 v4：已清空全部模拟数据。首次打开是空空间：
      只有两个人、情侣码、六域色板，其余全部等你们自己填。
   ⚠️ 不写负数：points_ledger 只增不减，消耗走 redemptions。
   ============================================================ */
(function (global) {
  'use strict';

  var KEY = 'women.store.v1';
  var VERSION = 4;

  /* ---------------- 日期工具 ---------------- */
  var D = {
    pad: function (n) { return (n < 10 ? '0' : '') + n; },
    key: function (d) {
      return d.getFullYear() + '-' + D.pad(d.getMonth() + 1) + '-' + D.pad(d.getDate());
    },
    parse: function (k) {
      var p = String(k).split('-');
      return new Date(+p[0], +p[1] - 1, +p[2]);
    },
    today: function () { return D.key(new Date()); },
    shift: function (k, n) {
      var d = D.parse(k);
      d.setDate(d.getDate() + n);
      return D.key(d);
    },
    diffDays: function (a, b) {
      return Math.round((D.parse(b) - D.parse(a)) / 86400000);
    },
    md: function (k) {
      var d = D.parse(k);
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    },
    wd: function (k) {
      return '星期' + '日一二三四五六'.charAt(D.parse(k).getDay());
    },
    minutes: function (start, end) {         // 跨夜也对：23:00–08:30 → 570
      var a = D.hm(start), b = D.hm(end);
      if (a == null || b == null) return 0;
      var m = b - a;
      if (m < 0) m += 1440;
      return m;
    },
    hm: function (s) {
      if (!s || typeof s !== 'string') return null;
      var p = s.split(':');
      if (p.length < 2) return null;
      return (+p[0]) * 60 + (+p[1]);
    },
    dur: function (min) {
      min = Math.round(min || 0);
      var h = Math.floor(min / 60), m = min % 60;
      if (h && m) return h + ' 小时 ' + m + ' 分';
      if (h) return h + ' 小时';
      return m + ' 分';
    },
    durShort: function (min) {
      var h = (min || 0) / 60;
      return (Math.round(h * 10) / 10).toString().replace(/\.0$/, '') + 'h';
    },
    monthLabel: function (k) {
      var d = D.parse(k);
      return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月';
    },
    /* 6×7 网格，周一起点 */
    monthGrid: function (y, m) {
      var first = new Date(y, m, 1);
      var offset = (first.getDay() + 6) % 7;
      var start = new Date(y, m, 1 - offset);
      var out = [];
      for (var i = 0; i < 42; i++) {
        var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        out.push({ key: D.key(d), day: d.getDate(), inMonth: d.getMonth() === m });
      }
      return out;
    }
  };

  /* ---------------- 六域 ＋ 未分类 ---------------- */
  var CATEGORIES = [
    { id: 'health',  name: '健康', desc: '身体的事',     color: '#E9C9A3' },
    { id: 'career',  name: '事业', desc: '对外交付的',   color: '#A7C7EC' },
    { id: 'growth',  name: '成长', desc: '为自己长的',   color: '#A8CF9F' },
    { id: 'relate',  name: '关系', desc: '跟人有关的',   color: '#F2A6AC' },
    { id: 'life',    name: '生活', desc: '维持日常运转', color: '#C3A6EA' },
    { id: 'leisure', name: '休闲', desc: '纯放空',       color: '#93D2CE' },
    { id: 'none',    name: '未分类', desc: '暂时不知道归哪类', color: '#D8D5D2', locked: true }
  ];

  /* ---------------- 空空间（不带任何模拟记录） ---------------- */
  function seed() {
    var t = D.today();
    return {
      version: VERSION,
      members: [
        { id: 'me',  name: '小满', role: '她', side: 'pink', avatar: null },
        { id: 'him', name: '阿辰', role: '他', side: 'blue', avatar: null }
      ],
      couple: {
        code: 'WMS-' + (1000 + Math.floor(Math.random() * 9000)),
        since: t,          // 在一起天数从建空间那天算起
        shareOpen: true
      },
      categories: CATEGORIES.map(function (c) { return Object.assign({}, c); }),

      /* 以下全部留空——等你们自己动笔 */
      entries: [],
      goals: [],
      weekly_settlements: [],
      points_ledger: [],
      rewards: [],
      wishlist: [],
      story_entries: [],
      milestones: [],
      redemptions: [],

      /* 「换个灵感」的备选开头（系统内容，不是记录） */
      sparks: [
        '她把信纸折成一只小鸟，轻轻放进了雨后的水洼里。',
        '他在便利店门口停了一会儿，看着玻璃上的自己。',
        '那天的风很大，她把手插进口袋，走得很慢。',
        '他们约好不说再见，只说下次见。',
        '窗外的雨刚停，她想起还没回的那条消息。'
      ]
    };
  }

  /* ---------------- 持久化 ---------------- */
  function load() {
    try {
      var raw = global.localStorage.getItem(KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      // 版本不符＝旧版（含模拟数据）→ 作废，重建空空间
      if (!o || o.version !== VERSION) return null;
      return o;
    } catch (e) { return null; }
  }

  function save(db) {
    try { global.localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
  }

  var DB = load() || seed();
  save(DB);

  /* ---------------- 查询与写入 ---------------- */
  var store = {
    db: DB,
    date: D,
    save: function () { save(DB); },

    member: function (id) {
      return DB.members.filter(function (m) { return m.id === id; })[0];
    },
    setAvatar: function (memberId, dataUrl) {
      var m = store.member(memberId);
      if (m) { m.avatar = dataUrl; save(DB); }
    },

    cat: function (id) {
      if (!id) return DB.categories[DB.categories.length - 1];
      return DB.categories.filter(function (c) { return c.id === id; })[0] ||
             DB.categories[DB.categories.length - 1];
    },
    catColor: function (id) { return store.cat(id).color; },
    catName: function (id) { return store.cat(id).name; },

    entry: function (id) {
      return DB.entries.filter(function (e) { return e.id === id; })[0];
    },
    entriesOf: function (memberId, dateKey) {
      return DB.entries.filter(function (e) {
        return e.memberId === memberId && e.date === dateKey;
      }).sort(function (a, b) { return D.hm(a.start) - D.hm(b.start); });
    },
    entriesInRange: function (memberId, from, to) {
      return DB.entries.filter(function (e) {
        if (e.date < from || e.date > to) return false;
        if (memberId === 'all') return true;
        return e.memberId === memberId;
      });
    },
    unfinishedCount: function (memberId, dateKey) {
      return store.entriesOf(memberId, dateKey).filter(function (e) { return !e.categoryId; }).length;
    },

    addEntry: function (o) {
      o.id = 'e' + Date.now();
      o.minutes = D.minutes(o.start, o.end);
      DB.entries.push(o);
      save(DB);
      return o;
    },
    updateEntry: function (id, patch) {
      var e = store.entry(id);
      if (!e) return;
      Object.assign(e, patch);
      e.minutes = D.minutes(e.start, e.end);
      save(DB);
    },
    deleteEntry: function (id) {
      DB.entries = DB.entries.filter(function (e) { return e.id !== id; });
      save(DB);
    },

    distribution: function (memberId, from, to) {
      var list = DB.entries.filter(function (e) {
        if (e.date < from || e.date > to) return false;
        if (memberId !== 'all' && e.memberId !== memberId) return false;
        return e.minutes > 0;
      });
      var total = list.reduce(function (s, e) { return s + e.minutes; }, 0);
      var map = {};
      list.forEach(function (e) {
        var k = e.categoryId || 'none';
        map[k] = (map[k] || 0) + e.minutes;
      });
      return DB.categories.map(function (c) {
        return {
          id: c.id, name: c.name, color: c.color,
          minutes: map[c.id] || 0,
          pct: total ? Math.round((map[c.id] || 0) / total * 100) : 0
        };
      });
    },

    happySeries: function (memberId, from, to) {
      var out = [];
      var k = from;
      while (k <= to) {
        var list = store.entriesInRange(memberId, k, k).filter(function (e) { return e.happy; });
        var avg = list.length
          ? list.reduce(function (s, e) { return s + e.happy; }, 0) / list.length
          : null;
        out.push({ key: k, value: avg });
        k = D.shift(k, 1);
      }
      return out;
    },
    lowEntries: function (memberId, from, to) {
      return DB.entries.filter(function (e) {
        if (e.date < from || e.date > to) return false;
        if (memberId !== 'all' && e.memberId !== memberId) return false;
        return e.happy && e.happy <= 2;
      }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    },

    pointsOf: function (memberId) {
      var add = DB.points_ledger
        .filter(function (p) { return p.memberId === memberId; })
        .reduce(function (s, p) { return s + p.points; }, 0);
      var used = DB.redemptions.reduce(function (s, r) {
        return s + (memberId === 'me' ? (r.fromMe || 0) : (r.fromHim || 0));
      }, 0);
      return Math.max(0, add - used);
    },
    pointsBySource: function (memberId) {
      var own = 0, joint = 0;
      DB.points_ledger.forEach(function (p) {
        if (p.memberId !== memberId) return;
        if (p.type === 'joint') joint += p.points;
        else own += p.points;
      });
      return { own: own, joint: joint };
    },
    ledgerOf: function (memberId) {
      return DB.points_ledger.filter(function (p) { return p.memberId === memberId; })
        .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    },

    nextMeet: function () {
      var t = D.today();
      var list = DB.milestones
        .filter(function (m) { return m.kind === 'meet' && m.date >= t; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      return list[0] || null;
    },
    pastMeets: function () {
      var t = D.today();
      return DB.milestones
        .filter(function (m) { return m.kind === 'meet' && m.date < t; })
        .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    },
    daysTogether: function () { return D.diffDays(DB.couple.since, D.today()) + 1; },

    storySorted: function () {
      return DB.story_entries.slice().sort(function (a, b) { return a.seq - b.seq; });
    },
    storyLast: function () {
      var l = store.storySorted();
      return l.length ? l[l.length - 1] : null;
    },
    addStory: function (memberId, text) {
      var seq = DB.story_entries.length + 1;
      DB.story_entries.push({
        id: 's' + Date.now(), memberId: memberId, seq: seq,
        date: D.today(), text: text
      });
      ['me', 'him'].forEach(function (m) {
        DB.points_ledger.push({
          id: 'p' + m + Date.now(), memberId: m, type: 'joint',
          points: 5, label: '待定', note: '一起完成接龙', date: D.today()
        });
      });
      save(DB);
    },

    dayMarks: function (monthKey) {
      var map = {};
      DB.entries.forEach(function (e) {
        if (e.date.slice(0, 7) !== monthKey) return;
        var m = map[e.date] || { me: false, him: false };
        if (e.memberId === 'me') m.me = true; else m.him = true;
        map[e.date] = m;
      });
      return map;
    },

    /* 清空所有记录，保留成员、情侣码、色板 */
    clearAll: function () {
      DB.entries = [];
      DB.goals = [];
      DB.weekly_settlements = [];
      DB.points_ledger = [];
      DB.rewards = [];
      DB.wishlist = [];
      DB.story_entries = [];
      DB.milestones = [];
      DB.redemptions = [];
      save(DB);
    }
  };

  store.D = D;
  global.Store = store;
})(window);


/* ============================================================
   ui.js

    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  /* ---------------- 日历 ---------------- */
  function calendar(monthKey, marks, todayKey, selectedKey, picker) {
    var d = D.parse(monthKey + '-01');
    var y = d.getFullYear(), mo = d.getMonth();
    var grid = D.monthGrid(y, mo);
    var cells = grid.map(function (c) {
      var m = marks[c.key] || {};
      var marksHtml = '';
      if (m.me && m.him) {
        marksHtml = '<i style="background:#E8899C"></i><i style="background:#7FA9DB"></i>';
      } else if (m.me) {
        marksHtml = '<i style="background:#E8899C"></i>';
      } else if (m.him) {
        marksHtml = '<i style="background:#7FA9DB"></i>';
      }
      var cls = 'cal-cell' + (c.inMonth ? '' : ' out') +
        (c.key === todayKey ? ' today' : '') +
        (c.key === selectedKey ? ' sel' : '');
      return '<div class="' + cls + '" data-day="' + c.key + '">' +
        '<span class="d">' + c.day + '</span>' +
        '<span class="cal-marks">' + marksHtml + '</span>' +
      '</div>';
    }).join('');

    /* 年月直接选择面板 */
    var pickerHtml = '';
    if (picker) {
      var months = '';
      for (var i = 0; i < 12; i++) {
        months += '<button class="cp-m' + (i === mo ? ' on' : '') +

  /* ---------------- 快乐值折线（SVG） ---------------- */
  function happyChart(series, selectedKey) {
    var w = 320, h = 128, padL = 22, padR = 8, padT = 14, padB = 24;
    var iw = w - padL - padR, ih = h - padT - padB;
    var n = series.length;
    var stepX = n > 1 ? iw / (n - 1) : 0;
    var pts = series.map(function (p, i) {
      var x = padL + i * stepX;
      var y = p.value == null ? null : padT + ih - ((p.value - 1) / 4) * ih;
      return { x: x, y: y, v: p.value, key: p.key };
    });

    var grid = '';
    [1, 2, 3, 4, 5].forEach(function (v) {
      var y = padT + ih - ((v - 1) / 4) * ih;
      grid += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y +
        '" stroke="#F1ECE6" stroke-width="1"/>';
      grid += '<text x="' + (padL - 6) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="9" fill="#C6C0B9">' + v + '</text>';
    });

    // 折线：空值断开
    var segs = [], cur = [];
    pts.forEach(function (p) {
      if (p.y == null) { if (cur.length) { segs.push(cur); cur = []; } }
      else cur.push(p);
    });
    if (cur.length) segs.push(cur);

    var lines = segs.map(function (seg) {
      if (seg.length === 1) return '';
      return '<polyline fill="none" stroke="#E8899C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="' +
        seg.map(function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ') + '"/>';
    }).join('');

    // 面积
    var area = segs.map(function (seg) {
      if (seg.length < 2) return '';
      var dpath = 'M' + seg[0].x.toFixed(1) + ',' + (padT + ih) + ' L' +
        seg.map(function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' L ') +
        ' L' + seg[seg.length - 1].x.toFixed(1) + ',' + (padT + ih) + ' Z';
      return '<path d="' + dpath + '" fill="rgba(232,137,156,.10)" stroke="none"/>';
    }).join('');

    var dots = pts.map(function (p) {
      if (p.y == null) return '';
      var on = p.key === selectedKey;
      return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (on ? 4.2 : 2.8) +
        '" fill="' + (on ? '#D9748A' : '#fff') + '" stroke="#E8899C" stroke-width="1.6" data-hday="' + p.key + '" style="cursor:pointer"/>';
    }).join('');

    var xlab = pts.map(function (p) {
      var d = D.parse(p.key);
      return '<text x="' + p.x.toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle" font-size="9" fill="#B5AFA8">' +
        (d.getMonth() + 1) + '/' + d.getDate() + '</text>';
    }).join('');

    return '<div class="chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '">' +
      grid + area + lines + dots + xlab +
    '</svg></div>';
  }

        '</div>' +
        UI.entriesBlock(side, t, { arrow: true, editable: side === 'me' }) +

      // 今日时间分布
      var dist = S.distribution(side, t, t);
      var un = S.unfinishedCount(side, t);
      html += '<div class="card">' +
        '<div class="card-title">今日时间分布' +
          '<span class="sub">共 ' + (total ? D.dur(total) : '0 分') + '</span>' +

                '<span class="go">' + UI.icon('right', 13) + '</span>' +
              '</button>' : '') +
      '</div>';
      return html;
    }

    /* ---------- 电脑版单栏 ---------- */
    function deskCol(side, label, motto) {
      var m = side === 'me' ? me : him;
      var rows = S.entriesOf(side, t);
      var total = rows.reduce(function (s, e) { return s + e.minutes; }, 0);
      var dist = S.distribution(side, t, t);
      var un = S.unfinishedCount(side, t);

      var html = '<div class="pair-col ' + side + '">' +
        '<div class="col-head">' +
          UI.avatar(m, 34, 'col') +
          '<div style="flex:1"><div class="col-name">' + label + ' · ' + m.name + '</div>' +
          '<div class="col-sub" style="margin-top:2px">' + motto + '</div></div>' +
        '</div>' +
        '<div class="col-card">' +
          UI.entriesBlock(side, t, { arrow: true, editable: side === 'me' }) +
        '</div>' +
        '<div class="col-card">' +
          '<div class="card-title">今日时间分布' +
            '<span class="sub">共 ' + (total ? D.dur(total) : '0 分') + '</span></div>' +
          UI.stack(dist) + UI.legend(dist, true) +
        '</div>';

      if (un) {
        html += '<div class="col-card">' +
          '<div class="card-title">待整理<span class="sub">' + un + ' 条未分类</span></div>' +
          '<div style="font-size:12.5px;color:var(--ink-3);margin:-4px 0 10px">这些记录还没有归到具体类型。</div>' +
          rows.filter(function (e) { return !e.categoryId; }).map(function (e) {
            return '<div class="ledger-row" style="border-top:0;padding:5px 0">' +
              '<span class="entry-time">' + esc(e.start) + '</span>' +
              '<span style="font-size:13px">' + esc(e.content) + '</span>' +
              '<span class="d" style="color:var(--ink-4)">' + UI.icon('right', 13) + '</span>' +
            '</div>';
          }).join('') +
        '</div>';
      }
      html += '</div>';
      return html;
    }

    var deskTop = '<div class="desk-top desk-only">' +
      '<span class="dt-date"><b>' + D.md(t) + '</b>' + D.wd(t) + '</span>' +
      '<span class="dt-pill">' + UI.icon('heart', 13) + '在一起 ' + together + ' 天</span>' +
      '<span class="dt-pill blue">' + UI.icon('calendar', 13) +
        '下次见面 ' + (cd == null ? '还没定' : cd + ' 天') + '</span>' +
      '<span class="dt-spacer"></span>' +
      '<button class="dt-parallel" data-act="parallel">' +
        UI.icon('eye', 15) + '平行空间：' + (expanded ? '已开启' : '已关闭') + '</button>' +
      '<button class="top-add" data-act="add">' + UI.icon('plus', 14) + '记一笔</button>' +
    '</div>';

    var deskHero = '<div class="desk-hero desk-only">' +
      '<h1 class="page-title">今天，过得怎么样？</h1>' +
      '<p class="page-sub">写一两行就好，不需要完美。</p>' +
    '</div>';

    var deskCols = '<div class="pair-cols desk-only' + (expanded ? '' : ' one') + '">' +
      deskCol('me', '我的一天', '认真生活，也好好爱你。') +
      (expanded ? deskCol('him', '他的今天', '上班很辛苦，也要好好照顾自己。') : '') +
    '</div>';

    var deskFoot = '<div class="desk-foot desk-only">' +
      '<div class="avas">' +
        UI.avatar(me, 24, 'side') +
        '<span style="margin-left:-8px;display:inline-block">' + UI.avatar(him, 24, 'side') + '</span>' +
      '</div>' +
      '<span>一起记录，慢慢变好</span>' +
    '</div>';

    /* ---------- 手机版整体 ---------- */
    var mobile =
      '<div class="mobile-only">' +
        '<div class="topline">' +
          '<div class="brand">我们</div>' +
          '<div class="topline-date"><span>' + D.md(t) + ' ' + D.wd(t) + '</span>' +
            UI.icon('calendar', 17) + '</div>' +
        '</div>' +
        '<div class="page-head">' +
          '<h1 class="page-title">今天，过得怎么样？</h1>' +
          '<p class="page-sub">记一两行就好。</p>' +
        '</div>' +
        statRow + parallelBtn + pairTabs +
        (st.todaySide === 'him' && !shareOpen
          ? '<div class="card"><div class="empty">他没有开放这一天的记录。<br>不追问，也不解释。</div></div>'
          : whoCard(st.todaySide)) +

    var fab = '<button class="fab" data-act="add">' + UI.icon('plus', 15) + '记一笔</button>';

    return page(deskTop + deskHero + deskCols + deskFoot + mobile + fab);

  Pages.together = function (st) {
    var me = S.member('me');
    var src = S.pointsBySource('me');
    var goals = S.db.goals.filter(function (g) { return g.memberId === 'me' && g.status === 'active'; });

    /* ----- 积分池 ----- */
    var pool = '<div class="card">' +
      '<div class="card-title">积分池</div>' +
      '<div class="pool">' +
        '<div class="pool-cell me">' +
          '<div class="pool-ico">' + UI.icon('heart', 18) + '</div>' +
          '<div class="pool-k">我的积分</div><div class="pool-v">待定</div></div>' +
        '<div class="pool-cell sum">' +
          '<div class="pool-ico">' + UI.icon('coins', 18) + '</div>' +
          '<div class="pool-k">合计可用</div><div class="pool-v">待定</div></div>' +
        '<div class="pool-cell him">' +
          '<div class="pool-ico">' + UI.icon('users', 18) + '</div>' +
          '<div class="pool-k">他的积分</div><div class="pool-v">待定</div></div>' +
      '</div>' +
      '<button class="pool-src" data-act="toggle-ledger">' +
        '<span>来源明细</span>' +
        '<span style="margin-left:auto;color:var(--ink-3)">自己做的 <b>待定</b> 分 · 一起做的 <b>待定</b> 分</span>' +
        '<span class="go">' + UI.icon('right', 14) + '</span>' +
      '</button>';

    if (st.showLedger) {
      var list = S.ledgerOf('me');
      pool += list.length
        ? list.map(function (p) {
            return '<div class="ledger-row">' +
              '<span class="src' + (p.type === 'joint' ? ' joint' : '') + '">' +
                (p.type === 'joint' ? '一起做的' : p.type === 'weekly_goal' ? '自己做的' : '手动') + '</span>' +
              '<span>' + esc(p.note) + '</span>' +
              '<span class="d">+' + p.points + '</span>' +
            '</div>';
          }).join('')
        : '<div class="empty">还没有积分记录。</div>';
    }
    pool += '</div>';

    /* ----- 本周进度（只显示自己的） ----- */
    var progRows = goals.map(function (g) {
      var c = S.cat(g.categoryId);
      var dots = '';
      for (var i = 0; i < g.timesPerWeek; i++) {
        dots += '<span class="dot-s' + (i < g.doneThisWeek ? ' on' : '') +
          '" style="color:' + c.color + '"></span>';
      }
      return '<button class="prog-row" data-act="go" data-go="goals">' +
        '<span class="prog-ico" style="background:' + UI.rgba(c.color, .18) + ';color:' + UI.shade(c.color) + '">' +
          UI.icon(g.icon, 18) + '</span>' +
        '<span class="prog-main"><span class="prog-name">' + esc(g.name) + '</span>' +
          '<span class="prog-dots">' + dots +
            '<span class="txt">' + g.doneThisWeek + '/' + g.timesPerWeek +
            ' · 累计' + g.totalWeeks + '周</span></span></span>' +
        '<span class="list-arrow">' + UI.icon('right', 16) + '</span>' +
      '</button>';
    }).join('');

    var settle = S.db.weekly_settlements;
    var settleRow = settle.length
      ? '<div class="settle-row">' + UI.icon('calendar', 14) +
          '<span>上周已结算：<b>' + esc(settle[0].text) + ' +' + settle[0].label + '分</b></span></div>'
      : '';

    var progress = '<div class="card">' +
      '<div class="card-title">本周进度<span class="sub">只显示自己</span></div>' +
      (progRows || '<div class="empty">还没有设置长期目标。</div>') +
      settleRow +
    '</div>';

    /* ----- 愿望清单 ----- */
    var tabs = [
      { k: 'together', n: '一起做的' },
      { k: 'eat', n: '想吃的' },
      { k: 'go', n: '想去的' }
    ];
    var wishTab = st.wishTab || 'together';
    var wishList = S.db.wishlist.filter(function (w) { return w.cat === wishTab; });

    var wish = '<div class="card">' +
      '<div class="card-title">愿望清单' +
        '<button class="card-link" data-act="go" data-go="wishlist">管理' + UI.icon('right', 12) + '</button>' +
      '</div>' +
      '<div class="mini-tabs">' + tabs.map(function (x) {
        return '<button class="mini-tab' + (wishTab === x.k ? ' on' : '') +
          '" data-act="wish-tab" data-k="' + x.k + '">' + x.n + '</button>';
      }).join('') + '</div>' +
      (wishList.length ? wishList.map(function (w) {
        var c = S.cat(w.cat === 'together' ? 'relate' : w.cat === 'eat' ? 'life' : 'leisure');
        return '<div class="wish-item">' +
          '<span class="wish-ico" style="background:' + UI.rgba(c.color, .18) + ';color:' + UI.shade(c.color) + '">' +
            UI.icon(w.icon || 'star', 19) + '</span>' +
          '<span class="wish-main"><span class="wish-name">' + esc(w.name) + '</span>' +
            '<span class="wish-meta">' + esc(w.executorLabel) + ' · ' + w.pointsLabel + '分</span></span>' +
          '<button class="wish-btn ' + (w.status === 'ready' ? '' : 'saving') + '" data-act="redeem" data-id="' + w.id + '">' +
            (w.status === 'ready' ? '去兑换' : w.status === 'done' ? '已完成' : '慢慢攒') + '</button>' +
        '</div>';
      }).join('') : '<div class="empty">这一类还没有愿望。</div>') +
    '</div>';

    /* ----- 故事接龙 ----- */
    var last = S.storyLast();
    var story = '<div class="card">' +
      '<div class="card-title">我们的故事接龙' +
        '<button class="card-link" data-act="go" data-go="story">去接龙' + UI.icon('right', 12) + '</button>' +
      '</div>' +
      (last ? '<div class="story-card">' +
        '<div class="story-head">' +
          '<span class="ico">' + UI.icon('speech', 13) + '</span>' +
          '<span>' + S.member(last.memberId).name + ' · ' + D.md(last.date) + '</span>' +
        '</div>' +
        '<div class="story-body">' + esc(last.text) + '</div>' +
        '<div class="story-foot"><button data-act="go" data-go="story">看看他写的' + UI.icon('right', 12) + '</button></div>' +
      '</div>' : '<div class="empty">还没有第一段。</div>') +
    '</div>';

    /* ----- 最近兑换 ----- */
    var rd = S.db.redemptions;
    var redeem = '<div class="card">' +
      '<div class="card-title">最近一次兑换</div>' +
      (rd.length ? rd.slice(0, 3).map(function (r) {
        return '<button class="prog-row" data-act="go" data-go="wishlist" style="border-top:0;padding:8px 0">' +
          '<span class="prog-ico" style="background:var(--pink-soft);color:var(--pink-deep)">' + UI.icon('gift', 17) + '</span>' +
          '<span class="prog-main"><span class="prog-name" style="font-size:13.5px">' + esc(r.name) + '</span>' +
            '<span class="prog-dots"><span class="txt">' + D.md(r.date) + '</span></span></span>' +
          '<span class="list-arrow">' + UI.icon('right', 16) + '</span>' +
        '</button>';
      }).join('') : '<div class="empty">还没有兑换过。</div>') +
    '</div>';

    return page(
      '<div class="page-head">' +
        '<h1 class="page-title">一起</h1>' +
        '<p class="page-sub">把想做的事慢慢实现</p>' +
      '</div>' +
      pool + progress + wish + story + redeem + DEMO,
      true
    );
  };

  /* ============================================================
     ④ 回看
     ============================================================ */
  Pages.review = function (st) {
    var t = D.today();
    var month = st.reviewMonth || t.slice(0, 7);
    var sel = st.reviewDay || t;
    var marks = S.dayMarks(month);
    var me = S.member('me'), him = S.member('him');
    var scope = st.reviewScope || 'all';

    /* ----- 月历 ----- */
    var calCard = '<div class="card">' +
      UI.calendar(month, marks, t, sel, st.calPicker) +
    '</div>';

    /* ----- 当日并排预览（复用今天页并排组件，无照片） ----- */
    function miniCol(side) {
      var m = side === 'me' ? me : him;
      var rows = S.entriesOf(side, sel);
      var total = rows.reduce(function (s, e) { return s + e.minutes; }, 0);
      return '<div style="flex:1;min-width:0">' +
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">' +
          UI.avatar(m, 20, 'who') +
          '<span style="font-size:12.5px;color:var(--ink-2)">' + m.name + '</span>' +
        '</div>' +
        (rows.length
          ? '<div class="entries">' + rows.map(function (e) {
              var c = S.cat(e.categoryId);
              return '<div class="entry" style="padding:7px 0">' +
                '<div class="entry-main">' +
                  '<div class="entry-line1">' +
                    '<span class="entry-time" style="font-size:11.5px">' + esc(e.start) + '</span>' +
                    '<span class="entry-chip" style="background:' + UI.rgba(c.color, .18) + ';color:' + UI.shade(c.color) + ';font-size:10px">' + c.name + '</span>' +
                  '</div>' +
                  '<div class="entry-text" style="font-size:13px;margin-top:2px">' + esc(e.content) + '</div>' +
                  '<div class="entry-bar" style="margin-top:6px"><i style="width:' +
                    Math.round(e.minutes / (total || 1) * 100) + '%;background:' + c.color + '"></i></div>' +
                '</div>' +
              '</div>';
            }).join('') + '</div>'
          : '<div style="font-size:12px;color:var(--ink-4);padding:14px 0">这天没有记录</div>') +
      '</div>';
    }

    var dayCard = '<div class="card">' +
      '<div class="card-title"><span>' + D.md(sel) +
        (sel === t ? ' · 今天' : ' · ' + D.wd(sel)) +
      '</span><span class="sub">' + (st.reviewScope === 'all' ? '两人并排' : '') + '</span>' +
      '</div>' +
      '<div style="display:flex;gap:16px">' + miniCol('me') + miniCol('him') + '</div>' +
    '</div>';

    /* ----- 时间分布（我／他／我们 三视角） ----- */
    var mStart = month + '-01';
    var mEnd = month + '-31';
    var dist = S.distribution(scope, mStart, mEnd);
    var maxMin = Math.max.apply(null, dist.map(function (d) { return d.minutes; }).concat([1]));

    var bars = dist.filter(function (d) { return d.minutes > 0; }).sort(function (a, b) {
      return b.minutes - a.minutes;
    }).map(function (d) {
      return '<div class="bar-row">' +
        '<span class="bar-ico" style="background:' + UI.rgba(d.color, .2) + ';color:' + UI.shade(d.color) + '">' +
          UI.catIcon(d.id, 14) + '</span>' +
        '<span class="bar-name">' + d.name + '</span>' +
        '<span class="bar-track"><i style="width:' + Math.round(d.minutes / maxMin * 100) + '%;background:' + d.color + '"></i></span>' +
        '<span class="bar-val">' + D.durShort(d.minutes) + '</span>' +
      '</div>';
    }).join('');

    // 给自己的时间＝成长＋休闲，只报一个合计；本周范围
    var wkFrom = D.shift(t, -((D.parse(t).getDay() + 6) % 7));
    var selfDist = S.distribution(scope, wkFrom, t);
    var selfMin = selfDist.filter(function (d) { return d.id === 'growth' || d.id === 'leisure'; })
      .reduce(function (s, d) { return s + d.minutes; }, 0);

    var scopeTabs = [
      { k: 'all', n: '我们' }, { k: 'me', n: '我' }, { k: 'him', n: '他' }
    ];

    var distCard = '<div class="card">' +
      '<div class="card-title">时间分布' +
        '<span class="mini-tabs" style="margin:0">' + scopeTabs.map(function (x) {
          return '<button class="mini-tab' + (scope === x.k ? ' on' : '') +
            '" data-act="scope" data-k="' + x.k + '">' + x.n + '</button>';
        }).join('') + '</span>' +
      '</div>' +
      (bars ? '<div class="bars">' + bars + '</div>' : '<div class="empty">这个月还没有记录。</div>') +
      '<div class="self-line"><span>给自己的时间 · 本周</span>' +
        '<b>' + (selfMin ? D.dur(selfMin).replace(' 小时 ', 'h').replace(' 分', 'm') : '0m') + '</b></div>' +
    '</div>';

    /* ----- 快乐值 ----- */
    var from = D.shift(t, -6);
    var series = S.happySeries(scope === 'him' ? 'him' : 'me', from, t);
    var lowList = '';
    if (st.happyDay) {
      var lows = S.lowEntries(scope === 'him' ? 'him' : 'me', st.happyDay, st.happyDay);
      lowList = '<div class="low-list">' +
        '<div style="font-size:12px;color:var(--ink-3);margin-bottom:6px">' +
          D.md(st.happyDay) + ' 的低分时段（≤2 分）</div>' +
        (lows.length ? lows.map(function (e) {
          var c = S.cat(e.categoryId);
          return '<div class="low-item">' +
            '<span class="t">' + esc(e.start) + '–' + esc(e.end) + '</span>' +
            '<span>' + esc(e.content) + '</span>' +
            '<span class="c" style="background:' + UI.rgba(c.color, .18) + ';color:' + UI.shade(c.color) + '">' + c.name + '</span>' +
            '<span class="s">' + e.happy + ' 分</span>' +
          '</div>';
        }).join('') : '<div style="font-size:12.5px;color:var(--ink-4)">这天没有低分记录。</div>') +
      '</div>';
    }

    var hasHappy = series.some(function (x) { return x.value != null; });
    var happyCard = '<div class="card">' +
      '<div class="card-title">快乐值' +
        '<button class="filter-btn' + (st.lowOnly ? ' on' : '') + '" data-act="low-toggle">只看低分时段</button>' +
      '</div>' +
      (hasHappy
        ? UI.happyChart(series, st.happyDay) +
          '<div class="chart-tip">点某一天 → 看那天的低分记录。不做评价，也不扣分。</div>'
        : '<div class="empty">近 7 天还没有快乐值记录。<br>记一笔的时候可以顺手打一个分。</div>') +
      (st.lowOnly ? (function () {
        var lows = S.lowEntries(scope === 'him' ? 'him' : 'me', from, t);
        return '<div class="low-list">' + (lows.length ? lows.map(function (e) {
          var c = S.cat(e.categoryId);
          return '<div class="low-item">' +
            '<span class="t">' + D.md(e.date) + '</span>' +

      '<div class="sub-lead">不用同时在线，也能一起写完一个故事。</div>' +

      (last ? '<div class="prev-card">' +
        '<div class="prev-head">' +
          '<span class="ico">' + UI.icon('speech', 13) + '</span>' +
          '<span>上一段 · ' + S.member(last.memberId).name + '写于' + D.md(last.date) + '</span>' +
        '</div>' +
        '<div class="prev-body">' + esc(last.text) + '</div>' +
      '</div>' : '') +

      '<div class="turn-badge">' + UI.icon('heart', 13) + '轮到你续写啦</div>' +

      '<div class="write-card">' +
        '<textarea class="write-area" id="story-input" maxlength="60" ' +
          'placeholder="接着上一段往下写 1–3 句…">' + esc(txt) + '</textarea>' +
        '<div class="write-foot">' +
          '<span class="write-count" id="story-count">写 1–3 句就好 · ' + txt.length + '/60</span>' +
          '<button class="spark-btn" data-act="spark">' + UI.icon('sparkle', 13) + '换个灵感（可选）</button>' +
        '</div>' +
      '</div>' +

      '<div class="point-band">' +
        '<span class="icon">' + UI.icon('star', 15) + '</span>' +
        '<span><span class="k">完成一次接龙，我们各得 待定分</span>' +
        '<span class="d">不需要每天写，想到了再继续</span></span>' +
      '</div>' +

      '<div class="btn-row">' +
        '<button class="btn-primary" data-act="publish">发布这一段</button>' +
        '<button class="btn-ghost" data-act="go" data-go="storyFull">查看整篇故事</button>' +
      '</div>' +
      '<div class="foot-line">🔴 统一用第三人称，接龙才能连成一篇。</div>'
    );
